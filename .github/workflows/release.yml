name: Prepare release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate exact tag and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- --tag "$RELEASE_TAG"
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run typecheck
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - name: Validate store files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- --artifacts --tag "$RELEASE_TAG"
      - name: Create draft with the three Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/main.js dist/manifest.json dist/styles.css
          --verify-tag --title "$RELEASE_TAG"
          --notes-file "docs/releases/$RELEASE_TAG.md" --draft
